<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIH Internal Round — Team Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E1326;
    --navy-2:#161C36;
    --panel:#1B2242;
    --line:#2C3560;
    --amber:#FFB454;
    --amber-dim:#7A5A2A;
    --mint:#5EEAD4;
    --red:#FF6B6B;
    --text:#EDEFF7;
    --text-dim:#9BA3C4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #1A2450 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #24164A 0%, transparent 40%),
      var(--navy);
    color:var(--text);
    font-family:'Inter',sans-serif;
    padding-bottom:80px;
  }
  header{
    padding:48px 24px 32px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:2px;
    color:var(--amber);
    text-transform:uppercase;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(28px,5vw,42px);
    margin:10px 0 6px;
  }
  .sub{color:var(--text-dim);font-size:15px;}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px;}
  .roster{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin:28px auto 0;
    max-width:760px;
    padding:0 20px;
  }
  .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--navy-2);
    color:var(--text-dim);
    transition:.2s;
  }
  .badge.ok{border-color:var(--mint);color:var(--mint);}
  .badge.warn{border-color:var(--red);color:var(--red);}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px;
    margin-bottom:20px;
  }
  .card h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:19px;
    margin:0 0 4px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--navy);
    background:var(--amber);
    padding:2px 8px;
    border-radius:6px;
    font-weight:700;
  }
  .tag.lead{background:var(--mint);}
  .card p.hint{color:var(--text-dim);font-size:13px;margin:0 0 18px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:600px){.grid{grid-template-columns:1fr;}}

  label{
    display:block;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--text-dim);
    margin-bottom:6px;
    letter-spacing:.5px;
  }
  .field{margin-bottom:14px;}
  input, select{
    width:100%;
    padding:11px 12px;
    background:var(--navy-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    font-size:14px;
    font-family:'Inter',sans-serif;
  }
  input:focus, select:focus{outline:none;border-color:var(--amber);}
  .id-status{font-size:12px;margin-top:5px;font-family:'IBM Plex Mono',monospace;min-height:16px;}
  .id-status.checking{color:var(--text-dim);}
  .id-status.free{color:var(--mint);}
  .id-status.taken{color:var(--red);}

  button#submitBtn{
    width:100%;
    padding:16px;
    font-size:16px;
    font-weight:700;
    font-family:'Space Grotesk',sans-serif;
    background:var(--amber);
    color:var(--navy);
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:6px;
  }
  button#submitBtn:disabled{background:var(--amber-dim);color:var(--text-dim);cursor:not-allowed;}
  button#submitBtn:hover:not(:disabled){filter:brightness(1.08);}

  #result{
    max-width:760px;margin:20px auto 0;padding:0 20px;
  }
  .msg{
    padding:16px 18px;border-radius:10px;font-size:14px;font-family:'IBM Plex Mono',monospace;
  }
  .msg.success{background:rgba(94,234,212,0.1);border:1px solid var(--mint);color:var(--mint);}
  .msg.error{background:rgba(255,107,107,0.1);border:1px solid var(--red);color:var(--red);}

  .admin-link{
    text-align:center;margin-top:40px;
  }
  .admin-link a{color:var(--text-dim);font-size:12px;font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Internal Round · Aug 29–30</div>
  <h1>SIH Team Registration</h1>
  <div class="sub">Fill this once per team. All 6 members are required.</div>
</header>

<div class="roster" id="roster"></div>

<div class="wrap">
  <form id="regForm">

    <div class="card">
      <h2>Domain &amp; Problem Statement</h2>
      <p class="hint">Choose the domain first — problem statements update to match.</p>
      <div class="field">
        <label>Domain</label>
        <select id="domain" required>
          <option value="" disabled selected>Select domain</option>
        </select>
      </div>
      <div class="field">
        <label>Problem Statement</label>
        <select id="problemStatement" required disabled>
          <option value="" disabled selected>Select domain first</option>
        </select>
      </div>
    </div>

    <div id="studentCards"></div>

    <div class="card">
      <h2>Mentor Details <span class="tag">once per team</span></h2>
      <p class="hint">Collected once for the whole team.</p>
      <div class="grid">
        <div class="field"><label>Mentor Name</label><input id="mentorName" required></div>
        <div class="field"><label>Mentor ID</label><input id="mentorId" required></div>
        <div class="field"><label>Mentor Department</label><input id="mentorDept" required></div>
        <div class="field"><label>Mentor Phone Number</label><input id="mentorPhone" type="tel" required></div>
      </div>
    </div>

    <button type="submit" id="submitBtn">Submit Registration</button>
  </form>

  <div id="result"></div>

  <div class="admin-link">
    <a href="#" id="adminExport">Download all registrations (CSV) →</a>
  </div>
</div>

<script>
/* ====================================================================
   CONFIG — change this to your deployed Render backend URL when ready.
   ==================================================================== */
const API_BASE_URL = "http://localhost:5000";

/* Domains and their problem statements — edit freely for your event. */
const DOMAIN_DATA = {
  "AI/ML": [
    "Smart irrigation system using predictive analytics",
    "AI-based attendance system using facial recognition"
  ],
  "Blockchain": [
    "Land record verification using blockchain",
    "Transparent public fund tracking system"
  ],
  "Healthcare": [
    "Remote patient monitoring dashboard",
    "AI-assisted early disease diagnosis tool"
  ],
  "Smart Automation": [
    "IoT-based smart classroom energy management",
    "Automated campus waste segregation system"
  ],
  "Fintech": [
    "Fraud detection for digital transactions",
    "Micro-savings app for rural users"
  ],
  "Miscellaneous": [
    "Open innovation — propose your own problem statement"
  ]
};

const YEAR_OPTIONS = ["1", "2", "3", "4"];
const GENDER_OPTIONS = ["Male", "Female", "Other"];
const RESIDENTIAL_OPTIONS = ["Hosteller", "Day Scholar"];

/* ---------------- Populate Domain dropdown ---------------- */
const domainSelect = document.getElementById("domain");
Object.keys(DOMAIN_DATA).forEach(d => {
  const opt = document.createElement("option");
  opt.value = d; opt.textContent = d;
  domainSelect.appendChild(opt);
});

const psSelect = document.getElementById("problemStatement");
domainSelect.addEventListener("change", () => {
  const statements = DOMAIN_DATA[domainSelect.value] || [];
  psSelect.innerHTML = "";
  psSelect.disabled = false;
  const placeholder = document.createElement("option");
  placeholder.value = ""; placeholder.disabled = true; placeholder.selected = true;
  placeholder.textContent = "Select problem statement";
  psSelect.appendChild(placeholder);
  statements.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s; opt.textContent = s;
    psSelect.appendChild(opt);
  });
});

/* ---------------- Build the 6 student cards ---------------- */
const studentCardsEl = document.getElementById("studentCards");
const memberLabels = ["Team Lead", "Member 2", "Member 3", "Member 4", "Member 5", "Member 6"];

function selectHTML(id, options, placeholder) {
  return `<select id="${id}" required>
    <option value="" disabled selected>${placeholder}</option>
    ${options.map(o => `<option value="${o}">${o}</option>`).join("")}
  </select>`;
}

memberLabels.forEach((label, i) => {
  const isLead = i === 0;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <h2>${label} <span class="tag ${isLead ? 'lead' : ''}">${isLead ? 'lead' : 'member'}</span></h2>
    <div class="grid">
      <div class="field">
        <label>Full Name</label>
        <input id="name_${i}" required>
      </div>
      <div class="field">
        <label>College ID No</label>
        <input id="idNo_${i}" required>
        <div class="id-status" id="idStatus_${i}"></div>
      </div>
      <div class="field">
        <label>Branch</label>
        <input id="branch_${i}" required>
      </div>
      <div class="field">
        <label>Year</label>
        ${selectHTML(`year_${i}`, YEAR_OPTIONS, "Select year")}
      </div>
      <div class="field">
        <label>Gender</label>
        ${selectHTML(`gender_${i}`, GENDER_OPTIONS, "Select gender")}
      </div>
      <div class="field">
        <label>Phone Number</label>
        <input id="phone_${i}" type="tel" required>
      </div>
      <div class="field">
        <label>Residential Status</label>
        ${selectHTML(`residential_${i}`, RESIDENTIAL_OPTIONS, "Select status")}
      </div>
    </div>
  `;
  studentCardsEl.appendChild(card);
});

/* ---------------- Live "already registered" ID check ---------------- */
const idCheckState = {}; // tracks whether each row's ID is known to be free

memberLabels.forEach((_, i) => {
  const input = document.getElementById(`idNo_${i}`);
  const statusEl = document.getElementById(`idStatus_${i}`);

  input.addEventListener("blur", async () => {
    const val = input.value.trim();
    if (!val) { statusEl.textContent = ""; statusEl.className = "id-status"; return; }

    statusEl.textContent = "Checking...";
    statusEl.className = "id-status checking";

    try {
      const res = await fetch(`${API_BASE_URL}/api/registrations/check/${encodeURIComponent(val)}`);
      const data = await res.json();
      if (data.alreadyRegistered) {
        statusEl.textContent = "✕ This ID is already registered.";
        statusEl.className = "id-status taken";
        idCheckState[i] = false;
      } else {
        statusEl.textContent = "✓ Available.";
        statusEl.className = "id-status free";
        idCheckState[i] = true;
      }
    } catch (err) {
      statusEl.textContent = "Couldn't reach server to check.";
      statusEl.className = "id-status taken";
    }
    updateRoster();
  });
});

/* ---------------- Roster progress badges ---------------- */
function updateRoster() {
  const rosterEl = document.getElementById("roster");
  let filled = 0;
  let hasFemale = false;

  memberLabels.forEach((_, i) => {
    const name = document.getElementById(`name_${i}`).value.trim();
    const idNo = document.getElementById(`idNo_${i}`).value.trim();
    if (name && idNo) filled++;
    if (document.getElementById(`gender_${i}`).value === "Female") hasFemale = true;
  });

  rosterEl.innerHTML = `
    <div class="badge ${filled === 6 ? 'ok' : ''}">${filled}/6 members filled</div>
    <div class="badge ${hasFemale ? 'ok' : 'warn'}">${hasFemale ? '✓' : '✕'} includes a female member</div>
  `;
}
studentCardsEl.addEventListener("input", updateRoster);
studentCardsEl.addEventListener("change", updateRoster);
updateRoster();

/* ---------------- Submit ---------------- */
const form = document.getElementById("regForm");
const resultEl = document.getElementById("result");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  resultEl.innerHTML = "";

  const students = memberLabels.map((_, i) => ({
    name: document.getElementById(`name_${i}`).value.trim(),
    idNo: document.getElementById(`idNo_${i}`).value.trim(),
    branch: document.getElementById(`branch_${i}`).value.trim(),
    year: document.getElementById(`year_${i}`).value,
    gender: document.getElementById(`gender_${i}`).value,
    phone: document.getElementById(`phone_${i}`).value.trim(),
    residentialStatus: document.getElementById(`residential_${i}`).value,
    isTeamLead: i === 0
  }));

  const payload = {
    domain: domainSelect.value,
    problemStatement: psSelect.value,
    mentor: {
      name: document.getElementById("mentorName").value.trim(),
      id: document.getElementById("mentorId").value.trim(),
      dept: document.getElementById("mentorDept").value.trim(),
      phone: document.getElementById("mentorPhone").value.trim()
    },
    students
  };

  // client-side checks for instant feedback (server re-checks everything for real)
  if (students.some(s => !s.gender)) {
    resultEl.innerHTML = `<div class="msg error">Please select gender for every member.</div>`;
    return;
  }
  if (!students.some(s => s.gender === "Female")) {
    resultEl.innerHTML = `<div class="msg error">Team must include at least one female member.</div>`;
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";

  try {
    const res = await fetch(`${API_BASE_URL}/api/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (res.ok) {
      resultEl.innerHTML = `<div class="msg success">✓ Registered successfully. Your Team ID is <strong>${data.teamId}</strong>. Please note this down.</div>`;
      form.reset();
      psSelect.innerHTML = `<option value="" disabled selected>Select domain first</option>`;
      psSelect.disabled = true;
      updateRoster();
    } else {
      resultEl.innerHTML = `<div class="msg error">${data.error || "Registration failed."}</div>`;
    }
  } catch (err) {
    resultEl.innerHTML = `<div class="msg error">Couldn't reach the server. Check that the backend is running and API_BASE_URL is correct.</div>`;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Registration";
  }
});

/* ---------------- Admin CSV export ---------------- */
document.getElementById("adminExport").addEventListener("click", (e) => {
  e.preventDefault();
  const key = prompt("Enter admin key:");
  if (key) {
    window.open(`${API_BASE_URL}/api/export/csv?key=${encodeURIComponent(key)}`, "_blank");
  }
});
</script>

</body>
</html>
